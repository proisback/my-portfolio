<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFE1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Chromium rejects a promise when it skips a cross-document view transition
       under load; navigation still completes, so don't surface it as an error. -->
  <script>addEventListener('unhandledrejection',function(e){var r=e.reason;if(r&&r.name==='InvalidStateError'&&/transition/i.test(r.message))e.preventDefault()})</script>
  <!-- Mark JS before first paint so entrance animations play once, not twice.
       If the main script never boots, drop the class so nothing stays hidden. -->
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.__booted)document.documentElement.classList.remove('js')},4000)</script>
  <!--@head-->
  <script type="module" src="/src/main.js"></script>
</head>

        <canvas id="scene"></canvas>
        <div class="stage-fallback" id="stage-fallback"></div>
        <div class="stage-veil"></div>
      </div>

</html>
